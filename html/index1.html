<!DOCTYPE html>
<html>
    <head>
        <title>Class Code</title>
    </head>
    <body>
        <h1>Registration Form</h1>
        <form name="registration_form" action="server.jsp" method="post">
            <table border="0">
                <tr>
                    <td><b>First Name</b>:</td>
                    <td width="20px"></td>
                    <td><input type="text" name="fname" width="50"></td>
                </tr>
                <tr>
                    <td><b>Last Name</b>:</td>
                    <td width="20px"></td>
                    <td><input type="text" name="lname" width="50"></td>
                </tr>
                <tr>
                    <td><b>Sex</b>:</td>
                    <td width="20px"></td>
                    <td><input type="radio" name="sex" value="M">&nbsp;Male&nbsp;&nbsp;<input type="radio" name="sex" value="F">&nbsp;Female&nbsp;&nbsp;</td>
                </tr>
                <tr>
                    <td><b>Age</b>:</td>
                    <td width="20px"></td>
                    <td><input type="text" name="age" width="50"></td>
                </tr>
                <tr>
                    <td><b>Address</b>:</td>
                    <td width="20px"></td>
                    <td><input type="text" name="address" width="50"></td>
                </tr>
                <tr>
                    <td colspan="3" align="center"><input type="submit" value="submit"></td>
                </tr>
            </table>
        </form>
    </body>
</html>
