<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" >
        <meta name="author" content="Komal">
        <link rel="stylesheet" href="../css/styles2.css">
        <title>Forms</title>
    </head>
    <body>
        <h1 align="center"><font color="red"><u>Form of Love</u></font></h1>
        <br>
        <form id="second" align="center">
            <label for="username">USERNAME:</label></td>
            <input type="text" id = "username" required></td>
            <span class="error" id="error"></span>
            <br>
            <br>
            <label for="email">Enter Email:</label>
            <input type="email" id = "email" required>
            <span class="error"></span>
            <br><br>
            <label for="password">Enter Password:</label>
            <input type="password" id = "password" required>
            <span class="error"></span>
            <br><br>
            Select your age:<br>
            <input type="radio" name="age" value="Bchi si" id="option-1">Bchi si<br>
            <input type="radio" name="age" value="Bcho ki srtaj" id="option-2">Bcho ki Sartaj<br>
            <input type="radio" name="age" value=" Chota Don" id="option-3">Chota Don<br>
            <input type="radio" name="age" value="Devi" id="option-4">Devi<br>
            <br><br>
            Security Questions:
            <select name="question">
                <option value="q1">What is your favorite sport?</option>
                <option value="q2">What is the name of your favorite player?</option>
                <option value="q3">What is your favorite security question?</option>
            </select>
            <br><br>
            Security Answer:
            <input type="text" name="answer">
            <br><br>
            <button type="submit">Submit</button>
        </form>
        <script>
            const form = document.getElementById("second");
            form.addEventListener("submit", function(event){
                event.preventDefault();
                clearError();
                const username = document.getElementById("username");
                const email = document.getElementById("email");
                const password = document.getElementById("password");
                let isvalid = true;
                if(username.value.trim().length<3 || email.validity.valid || password.value.length<6){
                    showError("error","Abey ye to bhr")
                }
                if(isvalid){
                    window.location.href="rkma.html";
                }
            });
            function showError(elementId, message){
                const errorElement = document.getElementById(elementId);
                console.log(errorElement);
                errorElement.textContent = message;
            }
            function clearError(){
                document.querySelectorAll(".error").forEach(element => {
                    element.textContent = "";
                });
            }
        </script>
    </body>
</html>
