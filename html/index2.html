<!DOCTYPE html>
<html>
<head>
<style>
  body, html {
    height: 100%;
    margin: 0;
    overflow: hidden; /* Prevent scrollbars */
    background-color: #000;
  }

  /* Stack all slides on top of each other */
  .slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    opacity: 0; /* Hidden by default */
    transition: opacity 1.5s ease-in-out; /* Smooth fade duration */
    z-index: 0;
  }

  /* The active slide is visible */
  .slide.active {
    opacity: 1;
    z-index: 1;
  }
</style>
</head>
<body>

<!-- Define slides as separate divs -->
<div class="slide active" style="background-image: url('../images/img.jpeg');"></div>
<div class="slide" style="background-image: url('../images/img2.jpeg');"></div>
<div class="slide" style="background-image: url('../images/img3.jpeg');"></div>

<script>
  const slides = document.querySelectorAll('.slide');
  let current = 0;
  const intervalTime = 3000; // Time between slides (ms)
  const transitionTime = 1500; // Must match CSS transition time (ms)

  function nextSlide() {
    // Remove active class from current
    slides[current].classList.remove('active');

    // Calculate next index
    current = (current + 1) % slides.length;

    // Add active class to next (triggers CSS fade)
    slides[current].classList.add('active');
  }

  // Start the loop
  setInterval(nextSlide, intervalTime);
</script>

</body>
</html>
